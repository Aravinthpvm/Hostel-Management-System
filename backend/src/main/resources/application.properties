# Application Name
spring.application.name=hostel-management-backend

# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/hostel_management
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
jwt.secret=${JWT_SECRET:change-this-development-secret-before-production-use}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging
logging.level.root=INFO
logging.level.com.hostelmgmt=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG
logging.level.org.springframework.security=DEBUG

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata
